# Local development stack: Postgres, Redis, the Fastify API and the Python services.
#
#   pnpm docker:up      # start everything
#   pnpm docker:logs    # follow logs
#   pnpm docker:down    # stop (add -v to wipe the database volume)
#
# The `worker` service is opt-in (BullMQ script-parsing consumer):
#   docker compose --profile worker up -d
#
# Images:
#   - backend/worker  -> packages/backend/Dockerfile (Node 24 + pnpm workspace)
#   - ocr-service     -> packages/ocr-service/Dockerfile (Python 3.12 + FastAPI)
#   - tts-service     -> packages/tts-service/Dockerfile (Python 3.12 + FastAPI)
#   - postgres/redis  -> upstream images, nothing to build
#   - mailpit         -> catches every e-mail the backend sends (invitations);
#                        inbox at http://localhost:8025
#   - frontend        -> no image: Vite runs on the host, iOS/Android via Capacitor
#
# Host ports were picked to avoid clashing with already-running local services
# (5432 and 8000 were taken on this dev machine, hence 5433 and 8001).
# Override any of them in `.env`.

name: osvald

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-osvald}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osvald}
      POSTGRES_DB: ${POSTGRES_DB:-osvald}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      # PostgreSQL 18+ keeps its cluster in /var/lib/postgresql/<major>/docker,
      # so the mount point is /var/lib/postgresql (not .../data).
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-osvald} -d ${POSTGRES_DB:-osvald}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-osvald}:${POSTGRES_PASSWORD:-osvald}@postgres:5432/${POSTGRES_DB:-osvald}
      REDIS_URL: redis://redis:6379
      OCR_SERVICE_URL: http://ocr-service:8000
      OCR_LANGUAGE: ${OCR_LANGUAGE:-ro}
      OCR_PDF_TIMEOUT_MS: ${OCR_PDF_TIMEOUT_MS:-900000}
      TTS_SERVICE_URL: http://tts-service:8000
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-min-32-characters-long}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:4173,http://localhost,capacitor://localhost}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      MAIL_FROM: ${MAIL_FROM:-Osvald <no-reply@osvald.local>}
      UPLOAD_DIR: /repo/packages/backend/uploads
    # Shared with `worker`, which reads the files this service stores.
    volumes:
      - uploads-data:/repo/packages/backend/uploads
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      # `localhost` resolves to IPv6 ::1 inside the Alpine image while Node
      # listens on IPv4, so probe 127.0.0.1 explicitly. Node is always present.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Development SMTP server: accepts every message and shows it in a web inbox.
  # Point SMTP_URL at a real server outside development.
  mailpit:
    image: axllent/mailpit:v1
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

  # Optional: the BullMQ consumer for the `script-parsing` queue.
  # Same image as `backend`, different entrypoint.
  # Enable with `docker compose --profile worker up -d`.
  worker:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    profiles: ['worker']
    restart: unless-stopped
    command: ['node', 'packages/backend/dist/queue/worker.js']
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-osvald}:${POSTGRES_PASSWORD:-osvald}@postgres:5432/${POSTGRES_DB:-osvald}
      REDIS_URL: redis://redis:6379
      OCR_SERVICE_URL: http://ocr-service:8000
      OCR_LANGUAGE: ${OCR_LANGUAGE:-ro}
      OCR_PDF_TIMEOUT_MS: ${OCR_PDF_TIMEOUT_MS:-900000}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-min-32-characters-long}
      UPLOAD_DIR: /repo/packages/backend/uploads
    volumes:
      - uploads-data:/repo/packages/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ocr-service:
    build:
      context: ./packages/ocr-service
      args:
        # PDFs with a text layer need nothing extra. Set to `true` to install
        # PaddleOCR (over a gigabyte) so scanned documents work too:
        #   docker compose build --build-arg WITH_PADDLE=true ocr-service
        WITH_PADDLE: ${WITH_PADDLE:-false}
        OCR_LANGUAGE: ${OCR_LANGUAGE:-ro}
    restart: unless-stopped
    environment:
      OCR_LANGUAGE: ${OCR_LANGUAGE:-ro}
      OCR_LOG_LEVEL: ${LOG_LEVEL:-info}
      # Most pages one request may OCR; 0 lifts the cap.
      OCR_MAX_OCR_PAGES: ${OCR_MAX_OCR_PAGES:-80}
      OCR_MAX_UPLOAD_BYTES: ${OCR_MAX_UPLOAD_BYTES:-67108864}
      # Longest side a page is rendered at before OCR; 0 lifts the cap.
      OCR_RENDER_MAX_SIDE: ${OCR_RENDER_MAX_SIDE:-2500}
      # Empty = every CPU Docker gives the container (fits a PC and a laptop).
      OCR_CPU_THREADS: ${OCR_CPU_THREADS:-}
      OCR_ENABLE_MKLDNN: ${OCR_ENABLE_MKLDNN:-true}
    ports:
      - '${OCR_SERVICE_PORT:-8001}:8000'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Server-side speech synthesis. The app uses it instead of the browser's
  # Web Speech API so the voices are the same on every operating system —
  # see packages/tts-service/README.md.
  tts-service:
    build:
      context: ./packages/tts-service
      args:
        # Bake the voice models into the image (~100 MB). Set to `false` for a
        # quick build; the service then downloads them on first use instead.
        TTS_PRELOAD_VOICES: ${TTS_PRELOAD_VOICES:-true}
    restart: unless-stopped
    environment:
      TTS_PROVIDERS: ${TTS_PROVIDERS:-piper,mms}
      TTS_LOG_LEVEL: ${LOG_LEVEL:-info}
      TTS_DATA_DIR: /data
      TTS_CACHE_MAX_BYTES: ${TTS_CACHE_MAX_BYTES:-536870912}
      TTS_MAX_CONCURRENCY: ${TTS_MAX_CONCURRENCY:-2}
    ports:
      - '${TTS_SERVICE_PORT:-8002}:8000'
    volumes:
      # Keeps the models and the rendered-line cache across rebuilds.
      - tts-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
  tts-data:
  uploads-data:
